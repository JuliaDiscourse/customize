name: Push to Discourse

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: discourse-sync
  cancel-in-progress: false

# The API key must only ever run alongside main's own (reviewed) code, so
# this workflow has no pull_request presence at all: a PR's diff *is* the
# preview of the API calls it will make, and CI tests the code.
jobs:
  push:
    runs-on: ubuntu-latest
    environment: "GitHub Actions CI"
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Full history for range diffing
        persist-credentials: false

    - name: Setup Julia
      uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
      with:
        version: '1'

    - name: Cache Julia packages
      uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0

    - name: Instantiate DiscourseAdmin.jl
      run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

    - name: Ensure the prior state matches the current Discourse settings
      env:
        API_KEY: ${{ secrets.API_KEY }}
        API_USER: ${{ secrets.API_USER }}
        BASE_SHA: ${{ github.event.before }}
      run: |
        REF="$BASE_SHA"
        git rev-parse -q --verify "$REF^{commit}" >/dev/null 2>&1 || REF=HEAD~1
        julia --project=. -e 'using DiscourseAdmin; DiscourseAdmin.main_pull()'
        git add -A .
        # Only routes the prior state already tracks can meaningfully drift:
        # a route directory first introduced by this change has nothing to
        # compare against (the pull job mirrors its live entries afterwards)
        DIRS=$(git ls-tree -r --name-only "$REF" -- admin | xargs -rn1 dirname | sort -u)
        if [ -n "$DIRS" ] && ! git diff --cached --quiet "$REF" -- $DIRS ':!*/.*'; then
          git diff --cached --stat "$REF" -- $DIRS ':!*/.*'
          echo "::error::The repository does not reflect the current Discourse state. The pull job will re-sync it automatically; then rebase and re-land this change."
          exit 1
        fi
        git reset -q --hard && git clean -qfd

    - name: Push changes to Discourse
      run: julia --project=. -e 'using DiscourseAdmin; DiscourseAdmin.main_push()'
      env:
        API_KEY: ${{ secrets.API_KEY }}
        API_USER: ${{ secrets.API_USER }}
        BEFORE_SHA: ${{ github.event.before }}

  # Verify the changes landed
  pull:
    needs: push
    if: ${{ always() }}
    permissions:
      contents: write
    uses: ./.github/workflows/pull-from-discourse.yml
    secrets: inherit
